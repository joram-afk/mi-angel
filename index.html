<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mi-angel — A Little Question</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="lovely-panel" role="dialog" aria-labelledby="q-title">
      <h1 id="q-title">A little question for you 💖</h1>
      <p class="lead">Open your heart and choose... or try to catch it!</p>

      <div class="question">Do you love me?</div>

      <div class="answers" id="answers">
        <button id="yes-btn" class="btn playful" aria-label="Yes">Yes</button>
        <button id="no-btn" class="btn calm" aria-label="No">No</button>
      </div>

      <p class="hint">Tip: try to click Yes — it likes to play!</p>
    </div>
  </main>

  <script>
    // Playful moving "Yes" button
    (function(){
      const answers = document.getElementById('answers');
      const yes = document.getElementById('yes-btn');
      const no = document.getElementById('no-btn');

      // Make container relative so yes can be positioned absolutely inside it
      answers.style.position = 'relative';

      // Initial styles for yes
      yes.style.position = 'absolute';
      yes.style.left = '16px';
      yes.style.top = '0px';
      yes.style.transition = 'left 180ms ease, top 180ms ease, transform 120ms ease';
      yes.style.zIndex = 2;

      // Keep 'no' static and accessible
      no.style.position = 'relative';
      no.style.marginLeft = '180px';

      // Utility: get random position within answers area
      function randomPos(button) {
        const rect = answers.getBoundingClientRect();
        const btnRect = button.getBoundingClientRect();
        const padding = 8; // keep some space from edges
        const maxX = rect.width - btnRect.width - padding;
        const maxY = rect.height - btnRect.height - padding;
        const x = Math.max(padding, Math.floor(Math.random() * (Math.max(1, maxX))));
        const y = Math.max(padding, Math.floor(Math.random() * (Math.max(1, maxY))));
        return {x,y};
      }

      // Move the yes button to a random spot
      function moveYes() {
        const p = randomPos(yes);
        yes.style.left = p.x + 'px';
        yes.style.top = p.y + 'px';
      }

      // On mouse move, if the cursor gets close to the yes button, move it away
      answers.addEventListener('mousemove', (e) => {
        const btn = yes.getBoundingClientRect();
        const dx = e.clientX - (btn.left + btn.width/2);
        const dy = e.clientY - (btn.top + btn.height/2);
        const dist = Math.hypot(dx, dy);
        const threshold = 120; // px — how close before it runs
        if (dist < threshold) {
          moveYes();
        }
      });

      // Also move on hover/focus/click attempt
      yes.addEventListener('mouseenter', moveYes);
      yes.addEventListener('focus', moveYes);

      // On click, if the button happens to be clicked, show a loving message
      yes.addEventListener('click', (e) => {
        e.preventDefault();
        // A sweet little reveal
        document.body.innerHTML = `\n          <main class="container">\n            <div class="lovely-panel">\n              <h1>Yay! 😍</h1>\n              <p class="lead">I knew it — I love you too.</p>\n              <p class="small">Send this page to someone you love.</p>\n            </div>\n          </main>`;
      });

      // No button behavior — show playful cheeky response if clicked
      no.addEventListener('click', (e) => {
        e.preventDefault();
        no.disabled = true;
        no.textContent = 'Oh...';
        no.classList.add('shrink');
        setTimeout(() => {
          no.textContent = 'I know you do 💕';
          no.disabled = false;
          no.classList.remove('shrink');
        }, 1200);
      });

      // Ensure yes starts in a visible/random place on load
      window.addEventListener('load', () => setTimeout(moveYes, 120));
      // Reposition if the window resizes
      window.addEventListener('resize', moveYes);

    })();
  </script>
</body>
</html>
